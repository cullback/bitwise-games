<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>__NAME__</title>
<style>
  html, body { margin: 0; height: 100%; background: #111; }
  body { display: flex; justify-content: center; align-items: center; }
  canvas { image-rendering: pixelated; border: 1px solid #444; }
  #status { position: fixed; top: 8px; left: 8px; color: #888; font: 12px monospace; }
</style>
</head>
<body>
<canvas id="screen" width="128" height="128"></canvas>
<div id="status">connecting…</div>
<script>
  const W = 128, H = 128;

  // PICO-8 palette. Indices must match the Color enum's discriminants on the
  // Rust side (src/draw_command.rs).
  const PALETTE = new Uint8Array([
    0,   0,   0,   // 0  black
    29,  43,  83,  // 1  dark blue
    126, 37,  83,  // 2  dark purple
    0,   135, 81,  // 3  dark green
    171, 82,  54,  // 4  brown
    95,  87,  79,  // 5  dark grey
    194, 195, 199, // 6  light grey
    255, 241, 232, // 7  white
    255, 0,   77,  // 8  red
    255, 163, 0,   // 9  orange
    255, 236, 39,  // 10 yellow
    0,   228, 54,  // 11 green
    41,  173, 255, // 12 blue
    131, 118, 156, // 13 lavender
    255, 119, 168, // 14 pink
    255, 204, 170, // 15 light peach
  ]);

  const canvas = document.getElementById('screen');
  const ctx = canvas.getContext('2d');
  const imageData = ctx.createImageData(W, H);
  const statusEl = document.getElementById('status');

  // Upscale the canvas to a pleasantly large display size while keeping the
  // pixel buffer at W×H. Integer scale factor so pixelated rendering stays crisp.
  function updateScale() {
    const margin = 0.9;
    const sx = window.innerWidth * margin / W;
    const sy = window.innerHeight * margin / H;
    const scale = Math.max(1, Math.floor(Math.min(sx, sy)));
    canvas.style.width = (W * scale) + 'px';
    canvas.style.height = (H * scale) + 'px';
  }
  updateScale();
  window.addEventListener('resize', updateScale);

  const ws = new WebSocket(`ws://${location.host}/`);
  ws.binaryType = 'arraybuffer';
  ws.onopen = () => { statusEl.textContent = ''; };
  ws.onclose = () => { statusEl.textContent = 'disconnected'; };
  ws.onmessage = (ev) => {
    if (!(ev.data instanceof ArrayBuffer)) return;
    const indices = new Uint8Array(ev.data);
    const data = imageData.data;
    for (let i = 0; i < W * H; i++) {
      const p = indices[i] * 3;
      const j = i * 4;
      data[j]     = PALETTE[p];
      data[j + 1] = PALETTE[p + 1];
      data[j + 2] = PALETTE[p + 2];
      data[j + 3] = 255;
    }
    ctx.putImageData(imageData, 0, 0);
  };

  // Only six keys are wired through: arrows + Z + X.
  const KEY_MAP = {
    ArrowUp: 'Up', ArrowRight: 'Right', ArrowDown: 'Down', ArrowLeft: 'Left',
    KeyZ: 'Z', KeyX: 'X',
  };

  const held = new Set();
  const sendKeys = () => {
    if (ws.readyState === WebSocket.OPEN) {
      ws.send(Array.from(held).join(','));
    }
  };

  window.addEventListener('keydown', (e) => {
    const k = KEY_MAP[e.code];
    if (!k || e.repeat) return;
    e.preventDefault();
    if (!held.has(k)) { held.add(k); sendKeys(); }
  });
  window.addEventListener('keyup', (e) => {
    const k = KEY_MAP[e.code];
    if (!k) return;
    e.preventDefault();
    if (held.delete(k)) sendKeys();
  });

  // Mouse position in framebuffer pixels (0..W, 0..H). Sent as "M:x,y" and
  // "M:" on leave. Throttled to at most one message per animation frame so
  // a fast drag doesn't flood the socket.
  let pendingMouse = null;
  let mouseScheduled = false;
  const flushMouse = () => {
    mouseScheduled = false;
    if (ws.readyState !== WebSocket.OPEN) return;
    if (pendingMouse === null) {
      ws.send('M:');
    } else {
      ws.send(`M:${pendingMouse.x},${pendingMouse.y}`);
    }
  };
  const scheduleMouse = () => {
    if (mouseScheduled) return;
    mouseScheduled = true;
    requestAnimationFrame(flushMouse);
  };
  canvas.addEventListener('mousemove', (e) => {
    const rect = canvas.getBoundingClientRect();
    const x = Math.floor((e.clientX - rect.left) * W / rect.width);
    const y = Math.floor((e.clientY - rect.top) * H / rect.height);
    if (x < 0 || x >= W || y < 0 || y >= H) {
      pendingMouse = null;
    } else {
      pendingMouse = { x, y };
    }
    scheduleMouse();
  });
  canvas.addEventListener('mouseleave', () => {
    pendingMouse = null;
    scheduleMouse();
  });
</script>
</body>
</html>
